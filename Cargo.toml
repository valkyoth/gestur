[workspace]
resolver = "3"
members = [
    "crates/gestur",
    "crates/gestur-api-types",
    "crates/gestur-core",
    "crates/gestur-crypto-types",
    "crates/gestur-events",
    "crates/gestur-policy",
    "crates/gestur-schema",
    "crates/gestur-testkit",
    "crates/gestur-workflow",
]
default-members = ["crates/gestur"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "EUPL-1.2"
repository = "https://github.com/valkyoth/gestur"
homepage = "https://github.com/valkyoth/gestur"
publish = false

[workspace.dependencies]
gestur-api-types = { path = "crates/gestur-api-types", version = "0.1.0" }
gestur-core = { path = "crates/gestur-core", version = "0.1.0" }
gestur-crypto-types = { path = "crates/gestur-crypto-types", version = "0.1.0" }
gestur-events = { path = "crates/gestur-events", version = "0.1.0" }
gestur-policy = { path = "crates/gestur-policy", version = "0.1.0" }
gestur-schema = { path = "crates/gestur-schema", version = "0.1.0" }
gestur-testkit = { path = "crates/gestur-testkit", version = "0.1.0" }
gestur-workflow = { path = "crates/gestur-workflow", version = "0.1.0" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"
