name: Release Tag Check

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release record and exact tag target
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate current tag and release evidence
        run: scripts/validate-tagged-release.sh "$GITHUB_REF_NAME"
